# kitty on macOS. Same look and keys as the Linux setup, minus the
# wallpaper-generated colors (those came from the Linux desktop shell).

# Font: Paper Mono (OFL, github.com/paper-design/paper-mono), with the Nerd Font
# for icons and Cyrillic, which Paper Mono lacks
font_family      family="Paper Mono" style="Regular"
italic_font      family="Paper Mono" style="Italic"
bold_font        family="Paper Mono" style="Bold"
bold_italic_font family="Paper Mono" style="Bold Italic"
font_size 16.0
symbol_map U+0400-U+052F,U+2DE0-U+2DFF,U+A640-U+A69F JetBrainsMono Nerd Font Mono
symbol_map U+23FB-U+23FE,U+2665,U+26A1,U+2B58,U+E000-U+F8FF,U+F0000-U+FFFFD JetBrainsMono Nerd Font Mono

cursor_shape beam
cursor_trail 1
window_margin_width 21.75

# Wide margins for reading, and back
map ctrl+shift+m remote_control set-spacing margin-h=300
map ctrl+shift+u remote_control set-spacing margin-h=default

allow_remote_control socket-only
listen_on unix:/tmp/kitty
confirm_os_window_close 0
shell /opt/homebrew/bin/fish

# Ctrl+C copies when text is selected, interrupts otherwise (Cmd+C works too)
map ctrl+c copy_or_interrupt
# Search the scrollback in a split
map ctrl+f        launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

wheel_scroll_multiplier 20.0
touch_scroll_multiplier 4.0
pixel_scroll yes
momentum_scroll 0.96
repaint_delay 2
input_delay 0
sync_to_monitor yes

map page_up   scroll_page_up
map page_down scroll_page_down
map ctrl+plus        change_font_size all +1
map ctrl+equal       change_font_size all +1
map ctrl+kp_add      change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore  change_font_size all -1
map ctrl+kp_subtract change_font_size all -1
map ctrl+0           change_font_size all 0
map ctrl+kp_0        change_font_size all 0

# macOS specifics
# Left Option is Alt inside the terminal (fish, herdr and Neovim alt keys).
# Right Option still types special characters.
macos_option_as_alt left
macos_quit_when_last_window_closed yes
hide_window_decorations titlebar-only

# Colors: run `kitty +kitten themes` once. It can save a light and a dark theme
# (light-theme.auto.conf, dark-theme.auto.conf) that follow macOS appearance.
background_opacity 0.9
background_blur 20
dynamic_background_opacity yes
# The Claude Code mods' docked pane grey, see through
transparent_background_colors #262626 #f5f5f5 #ebebeb
