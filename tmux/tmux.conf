# ~/.config/tmux/tmux.conf - simple starter config
# Reload inside tmux with:  prefix then :  then type  source-file ~/.config/tmux/tmux.conf

# --- Basics ---------------------------------------------------------------

# Good colors inside kitty
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:Tc"

# Let the mouse work: click panes, resize them, scroll with the wheel
set -g mouse on

# Windows and panes start at 1, not 0 (easier to reach on the keyboard)
set -g base-index 1
setw -g pane-base-index 1

# When you close a window, renumber the rest so there are no gaps
set -g renumber-windows on

# More scrollback history
set -g history-limit 50000

# --- Easier keybinds ------------------------------------------------------
# "prefix" means: press Ctrl+b first, release, then press the next key.

# Split panes with | (side by side) and - (top and bottom).
# New panes open in the same folder you were in.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window also opens in the current folder
bind c new-window -c "#{pane_current_path}"

# Move between panes with Alt + arrow keys, NO prefix needed
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Move between windows (tabs) with Alt + number, NO prefix needed
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# Reload this config with prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# --- Looks (status bar at the top, like in the video) ---------------------

set -g status-position top
set -g status-style "bg=default,fg=#c6d0f5"
set -g status-left "#[bold] #S  "
set -g status-right " %H:%M "
setw -g window-status-format "  #I:#W  "
setw -g window-status-current-format "#[reverse,bold]  #I:#W  "
